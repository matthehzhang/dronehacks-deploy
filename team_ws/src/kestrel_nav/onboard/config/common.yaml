/**:
  ros__parameters:
    # Physical ROS default. The simulator deployment selects its clock.
    use_sim_time: false
    # coursenav_loc: depth points within this of the aircraft's height are 2-D obstacles. The airframe spans
    # about -0.05..+0.08 m about its origin; 0.15 leaves ~5 cm margin and lets a 0.65 m tall window at 1.3 m
    # cruise route (was 0.25: the sill entered the band). Matthew, 2026-11-08.
    band_half_m: 0.15
